name: Update Static Nix Tools

# Publishes the static nix-tools zips Hydra built as a GitHub release, and
# opens the PR that bumps the pin, for each release tag:
#
#  * `nix-tools-*`    -> nix-tools-static.nix (the shared pin), from
#                        `<system>.nix-tools.static.zipped.*`.
#  * `nix-tools-sh-*` -> nix-tools-static-sh.nix, the stable-haskell variant
#                        built from ./nix-tools-sh against the Cabal fork,
#                        from `<system>.nix-tools-sh.static.zipped.*`.  Kept a
#                        separate pin on purpose: the existing GHC versions
#                        must keep the Cabal 3.16 tools.
#
# Nothing here waits for Hydra.  hydra-github-bridge posts a `hydra` commit
# status on every commit Hydra evaluates, and sets it to `success` once Hydra
# has evaluated the commit and finished every build.  That status change
# starts this workflow, which then releases whatever tags point at the
# commit.  A tag pushed after Hydra has already finished its commit is
# released by the tag push itself; a tag pushed earlier is left to the later
# status event.
#
# Release tags are cut from master commits, which Hydra evaluates in the
# `master` jobset.

on:
  status:
  push:
    tags:
      - "nix-tools-*"
  # Re-release a tag by hand, e.g. after restarting a failed Hydra build.
  workflow_dispatch:
    inputs:
      tag:
        description: "A nix-tools-* or nix-tools-sh-* tag to release"
        required: true

# Nothing on the find path writes; `release` elevates its own permissions.
# `statuses: read` is for the tag-push path's look at the `hydra` status.
permissions:
  contents: read
  statuses: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  find-releases:
    # Every commit status starts this workflow.  Only a successful `hydra`
    # one needs a look; the rest are skipped here without a runner.  (The
    # event's `branches` cannot narrow this to master commits: it lists at
    # most 10 branches that merely contain the commit.)
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'hydra' && github.event.state == 'success')
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
      eval: ${{ steps.find.outputs.eval }}
    steps:
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_URL: ${{ github.event.target_url }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY

          if [ "$EVENT" = status ]; then
            commit=$STATUS_SHA
            url=$STATUS_URL
            # The release tags pointing at this commit, if any.  `ls-remote`
            # also lists each annotated tag peeled (`<tag>^{}`) to its commit.
            tags=$(git ls-remote --tags "https://github.com/$repo" 'refs/tags/nix-tools-*' \
                     | awk -v c="$commit" '$1 == c { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
                     | sort -u)
          else
            if [ "$EVENT" = push ]; then tag=$GITHUB_REF_NAME; else tag=$INPUT_TAG; fi
            case "$tag" in
              nix-tools-*) ;;
              *) echo "::error::$tag is not a nix-tools-* or nix-tools-sh-* tag"; exit 1 ;;
            esac
            commit=$(gh api "repos/$repo/commits/$tag" --jq .sha)
            tags=$tag
            # Has Hydra finished this commit already?  The statuses come
            # newest first.
            hydra=$(gh api "repos/$repo/commits/$commit/statuses" \
                      --jq 'map(select(.context == "hydra")) | first // {}')
            state=$(jq -r '.state // "none"' <<<"$hydra")
            url=$(jq -r '.target_url // ""' <<<"$hydra")
            case "$state" in
              success) ;;
              failure|error)
                echo "::error::Hydra failed for $commit ($url); restart the failed builds there and $tag is released when the hydra status turns green"
                exit 1 ;;
              *)
                echo "::notice::Hydra has not finished $commit yet (hydra status: $state); $tag will be released when it does"
                tags="" ;;
            esac
          fi

          releases=$(printf '%s\n' $tags \
                       | jq -Rnc '[inputs | select(length > 0) | {tag: ., sh: startswith("nix-tools-sh-")}]')
          echo "commit $commit, releases $releases"
          evalid=""
          if [ "$releases" != "[]" ]; then
            # The bridge points the status at the Hydra evaluation.
            evalid=$(sed -n 's#.*/eval/\([0-9][0-9]*\).*#\1#p' <<<"$url")
            [ -n "$evalid" ] || { echo "::error::no Hydra evaluation in the hydra status URL '$url'"; exit 1; }
            echo "Hydra eval $evalid"
          fi
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "eval=$evalid" >> "$GITHUB_OUTPUT"

  release:
    needs: find-releases
    if: needs.find-releases.outputs.releases != '' && needs.find-releases.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.find-releases.outputs.releases) }}
    # A status event and a tag push can both see a finished commit; never
    # release one tag twice at once.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.tag }}
      cancel-in-progress: false

    # Needed to publish the release, push the pin branch and open the PR that
    # bumps the pin.  No path here runs pull request code: the commit is a
    # tagged master commit and everything else comes from Hydra.
    permissions:
      contents: write
      pull-requests: write

    env:
      TAG: ${{ matrix.tag }}
      EVAL: ${{ needs.find-releases.outputs.eval }}
      # `-sh` for the stable-haskell variant: the zip, job and pin names all
      # carry it.
      SFX: ${{ matrix.sh && '-sh' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only needed for `nix-hash` in the pin computation below.
      - name: Install Nix with good defaults
        uses: input-output-hk/install-nix-action@v20
        with:
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=
            substituters = https://cache.nixos.org/ https://cache.iog.io/ https://cache.zw3rk.com
          nix_path: nixpkgs=channel:nixos-unstable

      # Take the zips from Hydra, which built them, rather than reconstructing
      # our way back to them with nix: a linux runner cannot cheaply
      # instantiate these attributes, and substituting them from
      # cache.zw3rk.com is a race against whether hydra-attic-bridge pushed
      # them yet.  Hydra always has what it built and publishes a sha256 per
      # build product, so integrity still holds.
      - name: Download the zips from Hydra
        run: |
          set -euo pipefail
          hydra=https://ci.zw3rk.com
          prefix=nix-tools$SFX
          zip=nix-tools-static$SFX
          for job in aarch64-darwin.$prefix.static.zipped.$zip \
                     x86_64-darwin.$prefix.static.zipped.$zip \
                     x86_64-linux.$prefix.static.zipped.$zip \
                     x86_64-linux.$prefix.static.zipped.$zip-arm64; do
            # `--retry` covers transient Hydra errors (a 504 showed up while
            # testing this); a job missing from the eval still fails fast.
            meta=$(curl -sfL --retry 3 --retry-delay 5 --max-time 120 -H 'Accept: application/json' "$hydra/eval/$EVAL/job/$job") \
              || { echo "::error::$job is not in eval $EVAL"; exit 1; }
            # The `hydra` status only goes green once every build of the eval
            # finished and succeeded, so anything else is an error.
            [ "$(jq -r '.finished' <<<"$meta")" = 1 ] && [ "$(jq -r '.buildstatus' <<<"$meta")" = 0 ] \
              || { echo "::error::$job (build $(jq -r '.id' <<<"$meta")) did not succeed"; exit 1; }

            bid=$(jq -er '.id' <<<"$meta")
            prod=$(jq -er --arg z "-$zip.zip" \
                     '[.buildproducts | to_entries[] | select(.value.type == "file" and (.value.name | endswith($z)))] | first' <<<"$meta")
            nr=$(jq -er '.key' <<<"$prod")
            name=$(jq -er '.value.name' <<<"$prod")
            want=$(jq -er '.value.sha256hash' <<<"$prod")

            echo "$job -> build $bid product $nr ($name)"
            # Hydra serves these zips (100-250 MB) slowly, and a connection
            # dropped mid-transfer (curl exit 56) is not one of the errors
            # plain `--retry` considers transient (master fd0b59fda, run
            # 44000290404).  `--retry-all-errors` retries those too; each retry
            # restarts the file and the sha256 check below guards the result.
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$name" "$hydra/build/$bid/download/$nr"
            got=$(sha256sum "$name" | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "::error::$name sha256 mismatch: got $got, Hydra says $want"; exit 1; }
          done
          ls -l ./*-nix-tools-static$SFX.zip

      # Publish the release first so the download URLs the pin refers to
      # exist before the pin-bump PR does.  `tag_name` is explicit: on a
      # status event the workflow's own ref is master, not the tag.
      - name: Release
        uses: input-output-hk/action-gh-release@v1
        with:
          tag_name: ${{ matrix.tag }}
          files: |
            *-nix-tools-static${{ matrix.sh && '-sh' || '' }}.zip

      - name: Configure Git
        run: |
          git config --global user.name 'Auto Update Bot'
          git config --global user.email 'no-reply@iohk.io'

      # Update the pin on a fresh, per-release branch and open a PR against
      # master, rather than force-pushing a single reused branch and
      # hand-copying the file.  A per-tag branch keeps a 1:1 trail from
      # release to pin and avoids clobbering when two changes are in flight.
      - name: "Compute the pin and open a PR"
        run: |
          set -euo pipefail
          pin=nix-tools-static$SFX.nix
          git fetch origin master
          branch="update-nix-tools-static$SFX/$TAG"
          # Fetch the branch if an earlier run of this tag already pushed it,
          # so --force-with-lease has a remote-tracking ref to check against
          # (without one it insists the remote branch not exist and reruns
          # would fail).
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch --force-create "$branch" origin/master
          (
            if [ -n "$SFX" ]; then
              echo "# Generated by .github/workflows/upload-artifacts.yml for $TAG."
              echo "#"
              echo "# The stable-haskell nix-tools pin, built from ./nix-tools-sh against the"
              echo "# stable-haskell Cabal fork (3.19).  Separate from ./nix-tools-static.nix on"
              echo "# purpose: these tools must NOT become the default for the existing GHC"
              echo "# versions.  Opt in per project with haskell-nix.nix-tools-unchecked-sh; see"
              echo "# overlays/default.nix."
            fi
            echo "pkgs: let baseurl = \"https://github.com/ican-group/haskell.nix/releases/download/$TAG/\"; in {"
            for arch in aarch64-darwin x86_64-darwin aarch64-linux x86_64-linux; do
              echo "  ${arch} = pkgs.fetchurl { "
              echo "     name = \"${arch}-nix-tools-static$SFX\";"
              echo "     url = \"\${baseurl}${arch}-nix-tools-static$SFX.zip\";"
              echo "     sha256 = \"$(nix-hash --sri --type sha256 --flat ${arch}-nix-tools-static$SFX.zip)\";"
              echo "  };"
            done
            echo "}"
          ) > "$pin"
          cat "$pin"
          git add "$pin"
          # Nothing to do if this release's pin is already on master.
          if git diff --cached --quiet; then
            echo "$pin already up to date for $TAG; skipping PR."
            exit 0
          fi
          git commit -m "Update $pin for $TAG"
          git push --force-with-lease origin "$branch"
          # Skip PR creation only when one is already open for this branch;
          # any other gh failure (auth, API errors) must fail the job so a
          # dropped pin bump is not reported as success.
          if [ "$(gh pr list --head "$branch" --base master --state open --json number --jq length)" -gt 0 ]; then
            echo "A PR for $branch already exists."
          else
            if [ -n "$SFX" ]; then
              body="Automated pin bump: point \`$pin\` at the stable-haskell static nix-tools released for \`$TAG\`. This is the stable-haskell variant (Cabal fork), not the shared pin; nothing selects it by default."
            else
              body="Automated pin bump: point \`$pin\` at the static nix-tools binaries released for \`$TAG\`."
            fi
            gh pr create --base master --head "$branch" --title "Update $pin for $TAG" --body "$body"
          fi
